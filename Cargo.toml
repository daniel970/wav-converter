[package]
name = "wav-converter"
version = "0.3.0"
edition = "2021"
description = "음원 파일을 일괄로 WAV로 변환하는 GUI 도구 (Windows)"

[lib]
name = "wav_converter"
path = "src/lib.rs"

[[bin]]
name = "wav-converter"
path = "src/main.rs"

[dependencies]
# GUI
eframe = "0.29"
rfd = "0.15"
# 디코딩(모든 코덱) / 인코딩
symphonia = { version = "0.5", features = ["all"] }
hound = "3.5"
# 리샘플링
rubato = "0.16"
# 파일 탐색 / 에러
walkdir = "2"
anyhow = "1"

# Windows 전용: 드래그&드롭 시 OS에서 마우스 좌표 직접 조회.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[dev-dependencies]
hound = "3.5"

# 릴리스 빌드 최적화 (exe 크기 축소 + 속도)
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
